<svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- circle (origin) -->
  <circle cx="4" cy="12" r="2.5" stroke="#4D7A7A" stroke-width="1.3"/>
  <!-- connecting lines -->
  <line x1="6.5" y1="10" x2="9" y2="8" stroke="#4D7A7A" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="6.5" y1="14" x2="9" y2="16" stroke="#4D7A7A" stroke-width="1.1" stroke-linecap="round"/>
  <!-- diamonds -->
  <polygon points="12,6 14,8 12,10 10,8" stroke="#4D7A7A" stroke-width="1.3" fill="#4D7A7A" fill-opacity=".15"/>
  <polygon points="12,14 14,16 12,18 10,16" stroke="#4D7A7A" stroke-width="1.3" fill="#4D7A7A" fill-opacity=".15"/>
  <!-- connecting lines to squares -->
  <line x1="14" y1="8" x2="16" y2="7" stroke="#4D7A7A" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="14" y1="8" x2="16" y2="10" stroke="#4D7A7A" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="16" y2="14" stroke="#4D7A7A" stroke-width="1.1" stroke-linecap="round"/>
  <!-- squares -->
  <rect x="16" y="5" width="4" height="4" rx="0.5" stroke="#4D7A7A" stroke-width="1.2" fill="#4D7A7A" fill-opacity=".1"/>
  <rect x="16" y="10.5" width="4" height="4" rx="0.5" stroke="#4D7A7A" stroke-width="1.2" fill="#4D7A7A" fill-opacity=".1"/>
  <rect x="16" y="15" width="4" height="4" rx="0.5" stroke="#4D7A7A" stroke-width="1.2" fill="#4D7A7A" fill-opacity=".1"/>
</svg>
